<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>推荐信 · 电子信笺</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 延续淡蓝色水墨画背景 —— 与首页一致 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 主容器 —— 磨砂玻璃质感 */
        .page-wrapper {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(30, 70, 100, 0.2), 
                        0 4px 18px rgba(140, 180, 210, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 水墨装饰层 */
        .ink-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .ink-bg::before {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 280px;
            height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(160,200,225,0.18) 0%, transparent 70%);
            filter: blur(30px);
            border-radius: 50%;
        }
        .ink-bg::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 5%;
            width: 220px;
            height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(210,230,250,0.15) 0%, transparent 65%);
            filter: blur(25px);
        }

        /* 内容区 (置于上层) */
        .content {
            position: relative;
            z-index: 5;
        }

        /* 头部导航 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #1f5a78;
            text-decoration: none;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
        }
        .back-link i {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #0e3b4f;
            border-color: rgba(140, 190, 220, 0.5);
            transform: translateX(-4px);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem;
            color: #2e6279;
            opacity: 0.8;
            filter: drop-shadow(0 2px 6px rgba(90, 140, 170, 0.2));
        }
        .page-title h1 {
            font-weight: 350;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #1e4459;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            border-bottom: 1.5px solid rgba(70, 130, 160, 0.2);
            padding-bottom: 4px;
        }

        /* 图片展示区 —— 电子推荐信 */
        .letter-image-container {
            margin-top: 0.5rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            box-shadow: 0 15px 30px -12px rgba(40, 80, 110, 0.15), inset 0 1px 0 #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        .recommendation-image {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(30, 70, 100, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.7);
            display: block;
            margin: 0 auto;
            transition: transform 0.2s ease;
        }

        /* 图片下方装饰 */
        .caption {
            margin-top: 16px;
            color: #2a5e77;
            font-size: 0.9rem;
            opacity: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .caption i {
            font-size: 0.8rem;
        }

        /* 响应式 */
        @media screen and (max-width: 650px) {
            body {
                padding: 1rem 0.8rem;
                align-items: flex-start;
            }
            .page-wrapper {
                padding: 1.8rem 1.5rem;
            }
            .page-title h1 {
                font-size: 1.8rem;
            }
            .letter-image-container {
                padding: 12px;
            }
        }

        @media screen and (max-width: 480px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    
    <div class="content">
        <!-- 顶部导航 -->
        <div class="top-bar">
            <a href="about.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回作品集</a>
            <div class="page-title">
                <i class="fas fa-envelope-open-text"></i>
                <h1>推荐信</h1>
            </div>
        </div>

        <!-- 电子推荐信图片 -->
        <div class="letter-image-container">
            <img src="推荐信.jpg" alt="电子推荐信" class="recommendation-image">

        </div>
    </div>
</div>
</body>
</html>

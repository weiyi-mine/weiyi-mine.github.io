<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>嵌入式 · 项目作品集</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 水墨背景 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .page-wrapper {
            max-width: 1300px;
            width: 100%;
            background: rgba(245, 248, 250, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 80, 0.2), 
                        0 4px 18px rgba(120, 140, 160, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(210, 220, 230, 0.5);
            position: relative;
            overflow: hidden;
        }

        .ink-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .ink-bg::before {
            content: ''; position: absolute; bottom: -30px; right: -20px;
            width: 280px; height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(140, 160, 180, 0.15) 0%, transparent 70%);
            filter: blur(30px); border-radius: 50%;
        }
        .ink-bg::after {
            content: ''; position: absolute; top: 10px; left: 5%;
            width: 220px; height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(190, 205, 220, 0.12) 0%, transparent 65%);
            filter: blur(25px);
        }

        .content {
            position: relative; z-index: 5;
        }

        /* 头部 */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.8rem; flex-wrap: wrap;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 10px;
            color: #2c4b63; text-decoration: none; font-weight: 400;
            background: rgba(230, 235, 240, 0.5); padding: 8px 18px;
            border-radius: 60px; backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 195, 210, 0.5); transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(210, 220, 230, 0.7); color: #1a3a4e;
            border-color: #9aafc0; transform: translateX(-4px);
        }
        .page-title {
            display: flex; align-items: center; gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem; color: #5a6f7e; opacity: 0.9;
        }
        .page-title h1 {
            font-weight: 350; font-size: 2.2rem; letter-spacing: 2px;
            color: #1e4459; text-shadow: 2px 2px 8px rgba(255,255,255,0.5);
            border-bottom: 1.5px solid rgba(100, 120, 140, 0.3); padding-bottom: 4px;
        }

        /* 技术标签说明 */
        .tech-banner {
            margin-bottom: 28px; display: flex; align-items: center; gap: 15px;
            flex-wrap: wrap; background: rgba(200, 215, 230, 0.2);
            padding: 10px 22px; border-radius: 48px; backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 170, 190, 0.3);
        }
        .tech-banner i { color: #3f6a82; }
        .sensor-tag {
            background: #8faec2; color: #0f2e40; padding: 2px 12px;
            border-radius: 30px; font-size: 0.8rem;
        }

        /* 项目网格 */
        .projects-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px; margin-bottom: 30px;
        }

        /* 项目卡片 */
        .project-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px); border-radius: 28px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(210, 225, 240, 0.8);
            border-top: 6px solid #6a8ca0;
            box-shadow: 0 10px 20px -8px rgba(40, 70, 90, 0.15);
            transition: 0.2s; display: flex; flex-direction: column;
        }
        .project-card.planning {
            border-top-color: #b0b8c0; opacity: 0.9;
        }
        .project-card:hover {
            transform: translateY(-5px); background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 18px 28px -12px rgba(50, 80, 110, 0.2);
        }

        .card-header {
            display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px;
        }
        .card-icon {
            font-size: 2.2rem; color: #3b6e8a; background: #d9e6f0;
            width: 52px; height: 52px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
        }
        .card-title-section h3 {
            font-size: 1.4rem; font-weight: 550; color: #1a4357;
        }
        .status-badge {
            display: inline-block; margin-top: 4px; padding: 2px 10px;
            border-radius: 30px; font-size: 0.7rem; font-weight: 600;
            background: #2e7d5e; color: white;
        }
        .planning .status-badge {
            background: #9a8c6f;
        }

        .sensor-list {
            display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 14px;
        }
        .sensor-item {
            background: #e3edf5; border-radius: 30px; padding: 6px 14px;
            font-size: 0.8rem; display: flex; align-items: center; gap: 6px;
            border: 1px solid #b7cfdf;
        }

        .code-preview {
            background: #1e2e3a; color: #d4e6f0; padding: 12px 14px;
            border-radius: 18px; font-family: 'Courier New', monospace;
            font-size: 0.75rem; line-height: 1.5; margin: 12px 0;
            overflow-x: auto; white-space: pre-wrap; word-break: break-all;
            max-height: 140px; border: 1px solid #b0c9db;
        }

        .card-actions {
            display: flex; gap: 12px; margin-top: auto; justify-content: flex-end;
        }
        .btn {
            background: rgba(210, 225, 240, 0.7); border: 1px solid #8da9bc;
            padding: 8px 16px; border-radius: 40px; font-size: 0.8rem;
            color: #1e4459; cursor: pointer; backdrop-filter: blur(4px);
            transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; font-weight: 450;
        }
        .btn i { font-size: 0.9rem; }
        .btn:hover {
            background: #6a8ca0; color: white; border-color: #4e6f82;
        }
        .btn-outline {
            background: transparent;
        }

        .coming-soon-note {
            margin-top: 10px; font-style: italic; color: #5a6e7e;
        }

        /* 响应式 */
        @media screen and (max-width: 650px) {
            .page-wrapper { padding: 1.8rem 1.2rem; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    <div class="content">
        <div class="top-bar">
            <a href="industry.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工业作品集</a>
            <div class="page-title">
                <i class="fas fa-microchip"></i>
                <h1>嵌入式开发 · 项目集</h1>
            </div>
        </div>

        <div class="tech-banner">
            <i class="fas fa-cogs"></i>
            <span>每个项目均基于STM32，keil5，采用C语言开发，集成两种传感器。</span>
        
        </div>

        <!-- 项目卡片网格 -->
        <div class="projects-grid" id="projectsContainer"></div>

        <!-- 底部说明 -->
        <div style="margin-top: 20px; opacity: 0.5; font-size: 0.8rem; display: flex; gap: 20px;">
           </i> C语言 / HAL库</span>
            <span><i class="fas fa-microchip"></i> 传感器驱动编写、数据融合</span>
        </div>
    </div>
</div>

<script>
    // 嵌入式项目数据 —— 四个已完成压缩包 + 一个构思中项目
    const projects = [
        {
            name: '智能环境监测仪',
            status: 'completed',  // 已完成
            description: '基于STM32F103，实时采集温湿度、空气质量，通过OLED显示并上传OneNET。',
            sensors: ['DHT22 温湿度', 'MQ-135 空气质量'],
            codeSnippet: `// DHT22读取示例
uint8_t DHT_Read_Data(float *temp, float *humi) {
    uint8_t buf[5];
    DHT_Start();
    if(DHT_Read_Buf(buf) == 0) {
        *humi = (buf[0]*256 + buf[1])/10.0;
        *temp = ((buf[2]&0x7F)*256 + buf[3])/10.0;
        return 0;
    }
    return 1;
}`,
            downloadLink: 'projects/env_monitor.zip',  // 压缩包路径
            tags: ['STM32', 'HAL', 'Wi-Fi']
        },
        {
            name: '两轮自平衡小车',
            status: 'completed',
            description: 'MPU6050姿态解算，PID控制电机，实现直立与蓝牙遥控。',
            sensors: ['MPU6050 六轴', 'HC-SR04 超声波'],
            codeSnippet: `// 互补滤波角度计算
angle = 0.98 * (angle + gyroRate * dt) + 0.02 * accAngle;
// PID 速度环与直立环
balance_pwm = Kp_balance * angle + Kd_balance * gyro;
velocity_pwm = Kp_vel * velocity_error + Ki_vel * velocity_integral;`,
            downloadLink: 'projects/balance_car.zip',
            tags: ['PID', '互补滤波', '蓝牙']
        },
        {
            name: '物联网智能插座',
            status: 'completed',
            description: 'ESP32通过继电器控制通断，计量芯片HLW8032采集功率，支持MQTT远程控制。',
            sensors: ['HLW8032 电能计量', 'DS18B20 温度'],
            codeSnippet: `// HLW8032 串口解析
if(serial_available()) {
    uint8_t data = serial_read();
    if(hlw_parse(data)) {
        voltage = hlw.Voltage * 1.88;
        current = hlw.Current * 0.33;
        power = voltage * current;
    }
}`,
            downloadLink: 'projects/smart_plug.zip',
            tags: ['ESP32', 'MQTT', '电能计量']
        },
        {
            name: '仓库安防巡检机器人',
            status: 'completed',
            description: '基于STM32与ROS通信，搭载激光雷达与烟雾传感器，实现自主巡逻与报警。',
            sensors: ['TOF激光雷达', 'MQ-2 烟雾传感器'],
            codeSnippet: `// 激光雷达数据解析 (简略)
void lidar_callback(uint8_t *packet) {
    uint16_t distance = (packet[3]<<8) | packet[2];
    float angle = (packet[1] - 0xA0) * 0.5;
    if(distance < 300) obstacle_flag = 1;
}`,
            downloadLink: 'projects/patrol_robot.zip',
            tags: ['ROS', 'TOF', '电机驱动']
        },
        {
            name: '智能农业灌溉系统',
            status: 'planning',   // 构思中
            description: '（构思中）计划采用LoRa组网，多点土壤湿度采集，太阳能供电，云端决策灌溉。',
            sensors: ['电容式土壤湿度', '雨滴传感器'],
            codeSnippet: `// 规划架构：STM32L0 + SX1278
// 低功耗策略：RTC定时唤醒采集，LoRa发送后休眠。
// 传感器校准与阈值判断。`,
            downloadLink: null,
            tags: ['LoRa', '低功耗', '规划中']
        }
    ];

    const container = document.getElementById('projectsContainer');

    function renderProjects() {
        let html = '';
        projects.forEach(proj => {
            const isPlanning = proj.status === 'planning';
            const statusText = isPlanning ? '构思中 · 即将启动' : '已完成';
            const statusClass = isPlanning ? 'planning' : '';
            
            // 传感器HTML
            const sensorsHtml = proj.sensors.map(s => 
                `<span class="sensor-item"><i class="fas fa-microchip"></i> ${s}</span>`
            ).join('');

            // 按钮区域
            let actionButtons = '';
            if (!isPlanning) {
                actionButtons = `
                    <a href="${proj.downloadLink}" class="btn" download>
                        <i class="fas fa-download"></i> 下载压缩包
                    </a>
                    <button class="btn btn-outline" onclick="alert('工程包含完整Keil/VSCode项目，C语言源码及传感器驱动。')">
                        <i class="fas fa-info-circle"></i> 详情
                    </button>
                `;
            } else {
                actionButtons = `
                    <button class="btn btn-outline" disabled style="opacity:0.6;">
                        <i class="fas fa-hourglass-half"></i> 即将开放
                    </button>
                    <button class="btn btn-outline" onclick="alert('该项目正在技术选型与方案设计中，预计下月启动。')">
                        <i class="fas fa-lightbulb"></i> 构思中
                    </button>
                `;
            }

            html += `
                <div class="project-card ${statusClass}">
                    <div class="card-header">
                        <div class="card-icon">
                            <i class="fas fa-${isPlanning ? 'diagram-project' : 'microchip'}"></i>
                        </div>
                        <div class="card-title-section">
                            <h3>${proj.name}</h3>
                            <span class="status-badge">${statusText}</span>
                        </div>
                    </div>
                    <p style="margin-bottom: 8px; font-size:0.9rem; opacity:0.8;">${proj.description}</p>
                    <div class="sensor-list">
                        ${sensorsHtml}
                    </div>
                    <div class="code-preview">
                        ${proj.codeSnippet}
                    </div>
                    <div style="display:flex; gap:6px; margin:8px 0;">
                        ${proj.tags.map(t => `<span style="background:#cbdae5; padding:2px 10px; border-radius:20px; font-size:0.7rem;">${t}</span>`).join('')}
                    </div>
                    <div class="card-actions">
                        ${actionButtons}
                    </div>
                    ${isPlanning ? '<div class="coming-soon-note"><i class="fas-regular fa-clock"></i> 方案设计中，敬请期待</div>' : ''}
                </div>
            `;
        });
        container.innerHTML = html;
    }

    renderProjects();

    // 可额外添加全局函数供按钮调用
    window.showDetail = function(msg) { alert(msg); };
</script>

<!-- 说明：请将实际压缩包放在 projects/ 目录下并匹配文件名；代码片段仅作展示 -->
</body>
</html>

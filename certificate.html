<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>证书 · 资质认证</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 延续淡蓝色水墨画背景 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片容器 */
        .page-wrapper {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(30, 70, 100, 0.2), 
                        0 4px 18px rgba(140, 180, 210, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* 水墨装饰层 */
        .ink-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .ink-bg::before {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 280px;
            height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(160,200,225,0.18) 0%, transparent 70%);
            filter: blur(30px);
            border-radius: 50%;
        }
        .ink-bg::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 5%;
            width: 220px;
            height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(210,230,250,0.15) 0%, transparent 65%);
            filter: blur(25px);
        }

        /* 内容区 */
        .content {
            position: relative;
            z-index: 5;
        }

        /* 头部导航 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #1f5a78;
            text-decoration: none;
            font-weight: 400;
            background: rgba(255, 255, 255, 0.3);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
        }
        .back-link i { font-size: 0.9rem; opacity: 0.8; }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #0e3b4f;
            border-color: rgba(140, 190, 220, 0.5);
            transform: translateX(-4px);
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem;
            color: #2e7d5e;
            opacity: 0.9;
            filter: drop-shadow(0 2px 6px rgba(40, 120, 80, 0.15));
        }
        .page-title h1 {
            font-weight: 350;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #1e4459;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            border-bottom: 1.5px solid rgba(60, 140, 100, 0.3);
            padding-bottom: 4px;
        }

        /* 绿色系点缀说明 */
        .green-accent {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1c6e4f;
            font-size: 0.95rem;
        }
        .green-accent i {
            background: rgba(60, 150, 110, 0.15);
            padding: 6px 10px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
        }

        /* 证书卡片网格 (3个) */
        .certs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }

        /* 单个证书卡片 (绿色调) */
        .cert-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 22px 16px 18px;
            text-align: center;
            cursor: pointer;
            border: 2px solid rgba(200, 230, 210, 0.7);
            box-shadow: 0 10px 20px -8px rgba(30, 80, 60, 0.15);
            transition: all 0.25s ease;
            color: #1e3a4b;
            border-top: 6px solid #3e9f7a;
        }
        .cert-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 28px -12px rgba(40, 100, 80, 0.25);
            border-color: #8fc1aa;
            background: rgba(255, 255, 255, 0.65);
        }
        .cert-card.active {
            border: 3px solid #2e8b6c;
            box-shadow: 0 0 0 4px rgba(60, 150, 110, 0.2);
        }

        .cert-icon {
            font-size: 3.2rem;
            margin-bottom: 14px;
            color: #2a7a5c;
        }
        .cert-name {
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 8px;
            color: #154e3a;
        }
        .cert-issuer {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 16px;
        }

        /* 查证链接按钮 (绿色风格) */
        .verify-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(70, 150, 120, 0.2);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1b6e50;
            text-decoration: none;
            border: 1px solid rgba(60, 140, 100, 0.4);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            margin-top: 6px;
            cursor: pointer;
        }
        .verify-link i {
            font-size: 0.9rem;
        }
        .verify-link:hover {
            background: #3e9f7a;
            color: white;
            border-color: #2e7d5e;
        }

        /* 图片预览区 */
        .preview-section {
            margin-top: 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px 25px;
            border: 1px solid rgba(150, 200, 170, 0.5);
        }
        .preview-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }
        .preview-header i {
            font-size: 1.6rem;
            color: #2e8b6c;
        }
        .preview-header span {
            font-weight: 350;
            color: #1d4d63;
            font-size: 1.1rem;
        }
        .image-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
            background: rgba(0,0,0,0.02);
            border-radius: 24px;
            padding: 16px;
        }
        #previewImage {
            max-width: 100%;
            max-height: 360px;
            border-radius: 20px;
            box-shadow: 0 12px 24px -8px rgba(20, 60, 50, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.8);
            object-fit: contain;
            background: #eef7f2;
            transition: opacity 0.2s;
        }
        .placeholder-text {
            color: #386582;
            font-style: italic;
            opacity: 0.6;
        }

        /* 响应式 */
        @media screen and (max-width: 750px) {
            .certs-grid { grid-template-columns: 1fr; gap: 18px; }
            body { padding: 1rem 0.8rem; align-items: flex-start; }
            .page-wrapper { padding: 1.8rem 1.5rem; }
        }
        @media screen and (max-width: 480px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    
    <div class="content">
        <!-- 头部 -->
        <div class="top-bar">
            <a href="about.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回作品集</a>
            <div class="page-title">
                <i class="fas fa-certificate"></i>
                <h1>证书</h1>
            </div>
        </div>

        <!-- 绿色系说明 -->
        <div class="green-accent">
            <i class="fas fa-leaf"></i> 
            <span>点击卡片查看证书 · 点击“查证”跳转官方验证</span>
        </div>

        <!-- 三个证书卡片 -->
        <div class="certs-grid">

            <!-- 证书2 -->
            <div class="cert-card" data-cert="cert2" data-img="系统集成1.jpg,系统集成2.jpg" data-name="系统集成项目管理工程师（中级职称）">
                <div class="cert-icon"><i class="fas fa-chart-bar"></i></div>
                <div class="cert-name">中国专业技术人员职业资格证书</div>
                <div class="cert-issuer">计算机技术与软件专业技术资格</div>
                <a href="https://www.cpta.com.cn/" target="_blank" class="verify-link" onclick="event.stopPropagation();">
                    <i class="fas fa-external-link-alt"></i> 官网查证
                </a>
            </div>
            <!-- 证书3 -->
            <div class="cert-card" data-cert="cert3" data-img="深度学习.jpg" data-name="深度学习系统开发工程师">
                <div class="cert-icon"><i class="fas fa-paint-brush"></i></div>
                <div class="cert-name">IITC工信人才岗位能力评价证书</div>
                <div class="cert-issuer">工业和信息化部人才交流中心</div>
                <a href="https://www.miitec.cn/zscx/index.html" target="_blank" class="verify-link" onclick="event.stopPropagation();">
                    <i class="fas fa-external-link-alt"></i> 官网查证
                </a>
            </div>
                        <!-- 证书1 -->
            <div class="cert-card" data-cert="cert1" data-img="二级.jpg" data-name="计算机等级考试 二级">
                <div class="cert-icon"><i class="fas fa-laptop-code"></i></div>
                <div class="cert-name">计算机二级</div>
                <div class="cert-issuer">教育部考试中心</div>
                <a href="https://www.neea.edu.cn/html1/folder/22014/5516-1.htm" target="_blank" class="verify-link" onclick="event.stopPropagation();">
                    <i class="fas fa-external-link-alt"></i> 官网查证
                </a>
            </div>
        </div>

        <!-- 证书图片预览区 -->
        <div class="preview-section">
            <div class="preview-header">
                <i class="fas fa-image"></i>
                <span id="previewTitle">点击上方证书卡片查看大图</span>
            </div>
            <div class="image-container">
                <img id="previewImage" src="" alt="证书预览" style="display: none;">
                <div id="placeholderMsg" class="placeholder-text">
                    <i class="fas fa-arrow-up"></i> 选择证书，图片将显示于此
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const cards = document.querySelectorAll('.cert-card');
        const previewImg = document.getElementById('previewImage');
        const previewTitle = document.getElementById('previewTitle');
        const placeholderMsg = document.getElementById('placeholderMsg');
        
        // 新增：图片切换相关变量
        let currentImageList = [];      // 当前证书的图片数组
        let currentIndex = 0;           // 当前显示的图片索引
        let currentCertName = '';

        // 创建切换控件 (左右箭头 + 指示器)
        const navContainer = document.createElement('div');
        navContainer.className = 'image-nav';
        navContainer.style.cssText = 'display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 15px;';
        
        const prevBtn = document.createElement('button');
        prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
        prevBtn.style.cssText = 'background: rgba(70,150,120,0.2); border: 1px solid #3e9f7a; color: #1b6e50; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s;';
        prevBtn.onmouseover = () => prevBtn.style.background = '#3e9f7a';
        prevBtn.onmouseout = () => prevBtn.style.background = 'rgba(70,150,120,0.2)';
        
        const nextBtn = document.createElement('button');
        nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
        nextBtn.style.cssText = 'background: rgba(70,150,120,0.2); border: 1px solid #3e9f7a; color: #1b6e50; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(4px); transition: 0.2s;';
        nextBtn.onmouseover = () => nextBtn.style.background = '#3e9f7a';
        nextBtn.onmouseout = () => nextBtn.style.background = 'rgba(70,150,120,0.2)';
        
        const indicator = document.createElement('span');
        indicator.style.cssText = 'font-size: 0.9rem; color: #1e5e47; min-width: 60px; text-align: center;';
        
        navContainer.appendChild(prevBtn);
        navContainer.appendChild(indicator);
        navContainer.appendChild(nextBtn);
        
        // 将切换控件插入图片容器之后
        const imageContainer = document.querySelector('.image-container');
        imageContainer.parentNode.insertBefore(navContainer, imageContainer.nextSibling);
        
        // 初始隐藏导航
        navContainer.style.display = 'none';

// 更新预览图片与指示器（优化版）
function updateImageDisplay() {
    if (currentImageList.length === 0) {
        showPlaceholder();
        return;
    }

    const imgSrc = currentImageList[currentIndex];

    // 清除之前的错误监听，防止干扰
    previewImg.onerror = null;

    // 关键步骤：先清空 src，强制浏览器放弃缓存，再重新赋值
    previewImg.src = '';

    // 显示图片容器，隐藏占位符
    previewImg.style.display = 'block';
    placeholderMsg.style.display = 'none';
    previewTitle.textContent = `${currentCertName} (${currentIndex + 1}/${currentImageList.length})`;
    indicator.textContent = `${currentIndex + 1} / ${currentImageList.length}`;

    // 重新设置图片源，附加时间戳避免浏览器/服务器缓存
    previewImg.src = imgSrc + '?t=' + Date.now();

    // 加载失败时回退
    previewImg.onerror = function () {
        previewImg.style.display = 'none';
        placeholderMsg.style.display = 'block';
        placeholderMsg.innerHTML = '<i class="fas fa-exclamation-circle"></i> 图片加载失败，请检查文件路径';
        previewTitle.textContent = '图片加载失败';
        // 失败时也可以尝试去掉时间戳再试一次（可选）
        // previewImg.src = imgSrc; // 不推荐，容易陷入死循环
    };
}

// 显示图片集 (支持单张或多张) —— 优化版
function showImages(imgSrcString, certName) {
    if (!imgSrcString) {
        showPlaceholder();
        return;
    }

    // 用逗号分割，去除首尾空格
    currentImageList = imgSrcString.split(',').map(s => s.trim());
    currentIndex = 0;
    currentCertName = certName || '证书预览';

    // 控制导航栏显示
    if (currentImageList.length > 1) {
        navContainer.style.display = 'flex';
    } else {
        navContainer.style.display = 'none';
    }

    // 清空图片 src，防止上一张残留
    previewImg.src = '';
    updateImageDisplay();
}

// 显示占位符（重置所有状态）
function showPlaceholder() {
    previewImg.onerror = null;
    previewImg.src = '';               // 清空图片
    previewImg.style.display = 'none';
    placeholderMsg.style.display = 'block';
    placeholderMsg.innerHTML = '<i class="fas fa-hand-pointer"></i> 选择证书，图片将显示于此';
    previewTitle.textContent = '点击上方证书卡片查看大图';
    navContainer.style.display = 'none';
    currentImageList = [];
}

        // 切换按钮事件
        prevBtn.addEventListener('click', () => {
            if (currentImageList.length > 1) {
                currentIndex = (currentIndex - 1 + currentImageList.length) % currentImageList.length;
                updateImageDisplay();
            }
        });
        nextBtn.addEventListener('click', () => {
            if (currentImageList.length > 1) {
                currentIndex = (currentIndex + 1) % currentImageList.length;
                updateImageDisplay();
            }
        });

        // 移除active
        function removeActiveClass() {
            cards.forEach(c => c.classList.remove('active'));
        }

        // 卡片点击
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                const imgFiles = this.dataset.img;
                const certName = this.dataset.name || this.querySelector('.cert-name')?.textContent || '证书';
                
                removeActiveClass();
                this.classList.add('active');
                
                if (imgFiles) {
                    showImages(imgFiles, certName);
                } else {
                    showPlaceholder();
                }
            });
        });

        // 初始化占位
        showPlaceholder();
    })();
</script>

<!-- 说明：请将证书图片命名为 cert1.jpg, cert2.jpg, cert3.jpg 放在同目录，并修改查证链接为真实地址 -->
</body>
</html>

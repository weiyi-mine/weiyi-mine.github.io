<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>数据作品集 · 分析工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 延续淡蓝色水墨画背景 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片容器 —— 融入蓝紫调 */
        .page-wrapper {
            max-width: 1000px;
            width: 100%;
            background: rgba(245, 248, 255, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(60, 80, 120, 0.2), 
                        0 4px 18px rgba(120, 140, 180, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(200, 210, 240, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* 水墨装饰层 (蓝紫调晕染) */
        .ink-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .ink-bg::before {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 280px;
            height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(140, 150, 210, 0.15) 0%, transparent 70%);
            filter: blur(30px);
            border-radius: 50%;
        }
        .ink-bg::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 5%;
            width: 220px;
            height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(170, 180, 230, 0.12) 0%, transparent 65%);
            filter: blur(25px);
        }

        /* 内容区 */
        .content {
            position: relative;
            z-index: 5;
        }

        /* 头部导航 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #2c4b6e;
            text-decoration: none;
            font-weight: 400;
            background: rgba(230, 235, 250, 0.5);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(170, 185, 220, 0.5);
            transition: all 0.2s;
        }
        .back-link i { font-size: 0.9rem; opacity: 0.8; }
        .back-link:hover {
            background: rgba(210, 220, 245, 0.7);
            color: #1a3a5e;
            border-color: #9aafd0;
            transform: translateX(-4px);
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem;
            color: #5a6f9e;
            opacity: 0.9;
            filter: drop-shadow(0 2px 6px rgba(70, 90, 140, 0.15));
        }
        .page-title h1 {
            font-weight: 350;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #1e4460;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            border-bottom: 1.5px solid rgba(100, 120, 180, 0.3);
            padding-bottom: 4px;
        }

        /* 蓝紫系说明 */
        .data-tagline {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #2e4a70;
            font-size: 0.95rem;
            background: rgba(200, 210, 245, 0.2);
            padding: 10px 22px;
            border-radius: 48px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(140, 160, 210, 0.3);
        }
        .data-tagline i {
            color: #5a7ab0;
        }

        /* 卡片网格 (三个卡片居中) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-bottom: 20px;
        }

        /* 数据卡片 —— 蓝紫色调，清新科技感 */
        .data-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            background: rgba(240, 245, 255, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 32px 16px 28px;
            border: 1px solid rgba(190, 205, 240, 0.7);
            border-top: 5px solid #7e8fc0;
            box-shadow: 0 12px 22px -10px rgba(60, 80, 130, 0.18);
            transition: all 0.25s ease;
            color: #1e3f60;
            cursor: pointer;
        }
        .data-card:hover {
            transform: translateY(-8px);
            background: rgba(250, 252, 255, 0.75);
            box-shadow: 0 24px 30px -14px rgba(70, 100, 160, 0.25);
            border-color: #a0b5e0;
            border-top-width: 6px;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #4f6c9e;
            filter: drop-shadow(2px 6px 10px rgba(70, 100, 150, 0.12));
            transition: transform 0.2s;
        }
        .data-card:hover .card-icon {
            transform: scale(1.03);
            color: #34538b;
        }

        .card-title {
            font-weight: 550;
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #1d3e62;
        }

        .card-sub {
            font-size: 0.8rem;
            opacity: 0.75;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #2f5a80;
        }

        /* 数据可视化装饰 (点线) */
        .data-viz-deco {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            opacity: 0.4;
        }
        .viz-dot {
            width: 8px;
            height: 8px;
            background: #6a85b0;
            border-radius: 50%;
        }
        .viz-line {
            width: 50px;
            height: 1.5px;
            background: linear-gradient(90deg, #7e95c0, transparent);
        }

        /* 响应式 */
        @media screen and (max-width: 700px) {
            body { padding: 1rem 0.8rem; align-items: flex-start; }
            .page-wrapper { padding: 1.8rem 1.5rem; }
            .cards-grid { grid-template-columns: 1fr; gap: 20px; }
            .page-title h1 { font-size: 1.9rem; }
        }
        @media screen and (max-width: 480px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    
    <div class="content">
        <!-- 头部 -->
        <div class="top-bar">
            <a href="about.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回作品集</a>
            <div class="page-title">
                <i class="fas fa-chart-pie"></i>
                <h1>（搭建中）数据方向作品集</h1>
            </div>
        </div>

        <!-- 蓝紫系说明 -->
        <div class="data-tagline">
            <i class="fas fa-database"></i>
            <span>Python · SQL · 可视化 —— 点击卡片查看详情</span>
            <i class="fas fa-chart-bar" style="margin-left: auto;"></i>
        </div>

        <!-- 三个数据作品卡片 (点击跳转) -->
        <div class="cards-grid">
            <!-- 1. Python + Excel -->
            <a href="python+Excel.html" class="data-card">
                <div class="card-icon">
                    <i class="fab fa-python"></i>
                </div>
                <div class="card-title">Python + Excel</div>
                <div class="card-sub">数据处理 · 自动化报表</div>
            </a>
            <!-- 2. MySQL -->
            <a href="mysql.html" class="data-card">
                <div class="card-icon">
                    <i class="fas fa-database"></i>
                </div>
                <div class="card-title">MySQL</div>
                <div class="card-sub">查询优化 · 数据库设计</div>
            </a>
            <!-- 3. Power BI -->
            <a href="powerbi.html" class="data-card">
                <div class="card-icon">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="card-title">Power BI</div>
                <div class="card-sub">仪表板 · 商业智能</div>
            </a>
        </div>

        <!-- 数据装饰元素 (点线抽象) -->
        <div class="data-viz-deco">
            <span class="viz-dot"></span>
            <span class="viz-line"></span>
            <span class="viz-dot" style="background: #8a6ab0;"></span>
            <span class="viz-line"></span>
            <span class="viz-dot"></span>
            <span class="viz-line"></span>
            <span class="viz-dot" style="background: #6a85b0;"></span>
        </div>
    </div>
</div>

<!-- 说明：卡片跳转至对应页面，请确保 python+Excel.html, mysql.html, powerbi.html 文件存在 -->
</body>
</html>

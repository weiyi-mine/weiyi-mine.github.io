<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>工业作品集 · 智造工坊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 延续淡蓝色水墨画背景 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* 主卡片容器 —— 融入灰色调磨砂 */
        .page-wrapper {
            max-width: 1200px;
            width: 100%;
            background: rgba(245, 248, 250, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 80, 0.2), 
                        0 4px 18px rgba(120, 140, 160, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(210, 220, 230, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* 水墨装饰层 */
        .ink-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .ink-bg::before {
            content: '';
            position: absolute;
            bottom: -30px;
            right: -20px;
            width: 280px;
            height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(140, 160, 180, 0.15) 0%, transparent 70%);
            filter: blur(30px);
            border-radius: 50%;
        }
        .ink-bg::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 5%;
            width: 220px;
            height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(190, 205, 220, 0.12) 0%, transparent 65%);
            filter: blur(25px);
        }

        /* 内容区 */
        .content {
            position: relative;
            z-index: 5;
        }

        /* 头部导航 */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: #2c4b63;
            text-decoration: none;
            font-weight: 400;
            background: rgba(230, 235, 240, 0.5);
            padding: 8px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 195, 210, 0.5);
            transition: all 0.2s;
        }
        .back-link i { font-size: 0.9rem; opacity: 0.8; }
        .back-link:hover {
            background: rgba(210, 220, 230, 0.7);
            color: #1a3a4e;
            border-color: #9aafc0;
            transform: translateX(-4px);
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem;
            color: #5a6f7e;
            opacity: 0.9;
            filter: drop-shadow(0 2px 6px rgba(80, 100, 120, 0.15));
        }
        .page-title h1 {
            font-weight: 350;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #1e4459;
            text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.5);
            border-bottom: 1.5px solid rgba(100, 120, 140, 0.3);
            padding-bottom: 4px;
        }

        /* 灰色系工业感标语 */
        .industry-tagline {
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3a5468;
            font-size: 0.95rem;
            background: rgba(190, 205, 220, 0.2);
            padding: 10px 20px;
            border-radius: 48px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 170, 190, 0.3);
        }
        .industry-tagline i {
            color: #4f6f84;
        }

        /* 卡片网格 — 调整为更均衡的布局 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);  /* 固定四列，视觉更饱满 */
            gap: 24px;
            margin-bottom: 24px;
        }

        /* 工业卡片 —— 灰色调为主，带有金属质感 */
        .industry-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            background: rgba(235, 240, 245, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 26px 12px 22px;
            border: 1px solid rgba(190, 205, 220, 0.7);
            border-bottom: 4px solid #7e96a8;
            box-shadow: 0 10px 20px -8px rgba(50, 70, 90, 0.15);
            transition: all 0.25s ease;
            color: #1e3f54;
            cursor: pointer;
        }
        .industry-card:hover {
            transform: translateY(-6px);
            background: rgba(245, 250, 255, 0.75);
            box-shadow: 0 22px 28px -14px rgba(60, 90, 110, 0.25);
            border-color: #a0b8c8;
            border-bottom-width: 5px;
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 18px;
            color: #4d6677;
            filter: drop-shadow(2px 4px 6px rgba(70, 90, 110, 0.1));
            transition: transform 0.2s;
        }
        .industry-card:hover .card-icon {
            transform: scale(1.02);
            color: #335267;
        }

        .card-title {
            font-weight: 550;
            font-size: 1.3rem;
            margin-bottom: 6px;
            color: #1d3e52;
        }

        .card-sub {
            font-size: 0.75rem;
            opacity: 0.7;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2f5a70;
        }

        /* 工业装饰 (齿轮/铆钉) — 移出网格，独立居中 */
        .gear-decoration {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            opacity: 0.35;
            padding: 10px 0;
        }
        .gear-decoration i {
            font-size: 1rem;
            color: #607d8b;
        }
        /* 添加一条若隐若现的分隔线，强化工业秩序感 */
        .gear-decoration::before,
        .gear-decoration::after {
            content: '';
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #6a8599, transparent);
            opacity: 0.4;
        }
        .gear-decoration::before { margin-right: 10px; }
        .gear-decoration::after { margin-left: 10px; }

        /* 响应式 — 四列布局在小屏幕自动适配 */
        @media screen and (max-width: 900px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
            .page-wrapper { padding: 2rem 1.8rem; }
        }
        @media screen and (max-width: 750px) {
            body { padding: 1rem 0.8rem; align-items: flex-start; }
            .page-title h1 { font-size: 1.9rem; }
        }
        @media screen and (max-width: 480px) {
            .top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .cards-grid { grid-template-columns: 1fr; }
            .gear-decoration::before,
            .gear-decoration::after { width: 30px; }
        }

        /* 细微优化：让卡片内容在小屏更舒适 */
        @media screen and (max-width: 380px) {
            .industry-card { padding: 20px 8px 18px; }
            .card-title { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    
    <div class="content">
        <!-- 头部导航 -->
        <div class="top-bar">
            <a href="about.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回作品集</a>
            <div class="page-title">
                <i class="fas fa-industry"></i>
                <h1>工业作品集</h1>
            </div>
        </div>

        <!-- 工业说明栏 -->
        <div class="industry-tagline">
            <i class="fas fa-microchip"></i>
            <span>点击卡片查看作品 · 四大智造板块</span>
            <i class="fas fa-cog" style="margin-left: auto;"></i>
        </div>

        <!-- 四个工业方向卡片 -->
        <div class="cards-grid">
            <!-- 1. 嵌入式 -->
            <a href="qianrushi.html" class="industry-card">
                <div class="card-icon">
                    <i class="fas fa-microchip"></i>
                </div>
                <div class="card-title">嵌入式</div>
                <div class="card-sub">STM32 · 传感器 · 单片机</div>
            </a>
            <!-- 2. 工业机器人 -->
            <a href="industryrobot.html" class="industry-card">
                <div class="card-icon">
                    <i class="fas fa-cogs"></i>
                </div>
                <div class="card-title">工业机器人</div>
                <div class="card-sub">FANUC · ESTUN · 集成应用</div>
            </a>
            <!-- 3. SolidWorks -->
            <a href="solidworks.html" class="industry-card">
                <div class="card-icon">
                    <i class="fas fa-cube"></i>
                </div>
                <div class="card-title">SolidWorks</div>
                <div class="card-sub">工业3D建模</div>
            </a>
            <!-- 4. 智能工厂 -->
            <a href="factory+PLC.html" class="industry-card">
                <div class="card-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="card-title">智能工厂</div>
                <div class="card-sub">工厂搭建 · Factory IO · PLC</div>
            </a>
        </div>  <!-- 正确闭合卡片网格 -->

        <!-- 工业风装饰 — 独立于网格之外，视觉重心更稳 -->
        <div class="gear-decoration">
            <i class="fas fa-gear"></i>
            <i class="fas fa-gear" style="font-size: 0.8rem;"></i>
            <i class="fas fa-gear"></i>
            <i class="fas fa-gear" style="font-size: 0.8rem;"></i>
            <i class="fas fa-gear"></i>
        </div>
    </div>  <!-- 结束 .content -->
</div>  <!-- 结束 .page-wrapper -->
</body>
</html>

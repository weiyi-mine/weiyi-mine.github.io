<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>智能工厂 · PLC 集成项目（进行中）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            /* 水墨背景 */
            background-color: #dcebf7;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.6) 0%, rgba(200, 225, 245, 0.1) 40%, transparent 60%),
                radial-gradient(circle at 90% 75%, rgba(170, 210, 240, 0.35) 0%, rgba(220, 240, 255, 0.2) 50%, transparent 70%),
                radial-gradient(circle at 30% 85%, rgba(140, 190, 230, 0.25) 0%, transparent 55%),
                repeating-linear-gradient(45deg, rgba(150, 180, 210, 0.05) 0px, rgba(150, 180, 210, 0.05) 2px, transparent 2px, transparent 8px),
                radial-gradient(circle at 70% 15%, rgba(255, 255, 255, 0.7) 0%, rgba(190, 220, 245, 0.15) 35%, transparent 60%),
                radial-gradient(circle at 45% 60%, rgba(160, 200, 235, 0.2) 0%, transparent 50%);
            background-blend-mode: overlay, normal, normal, normal, normal, normal;
            backdrop-filter: blur(1px);
            color: #1a3b4e;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .page-wrapper {
            max-width: 1300px;
            width: 100%;
            background: rgba(245, 248, 250, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 20px 40px -12px rgba(30, 60, 80, 0.2), 
                        0 4px 18px rgba(120, 140, 160, 0.15),
                        inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(210, 220, 230, 0.5);
            position: relative;
            overflow: hidden;
        }

        .ink-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        .ink-bg::before {
            content: ''; position: absolute; bottom: -30px; right: -20px;
            width: 280px; height: 200px;
            background: radial-gradient(ellipse at 70% 50%, rgba(140, 160, 180, 0.15) 0%, transparent 70%);
            filter: blur(30px); border-radius: 50%;
        }
        .ink-bg::after {
            content: ''; position: absolute; top: 10px; left: 5%;
            width: 220px; height: 160px;
            background: radial-gradient(circle at 20% 30%, rgba(190, 205, 220, 0.12) 0%, transparent 65%);
            filter: blur(25px);
        }

        .content {
            position: relative; z-index: 5;
        }

        /* 头部 */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.8rem; flex-wrap: wrap;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 10px;
            color: #2c4b63; text-decoration: none; font-weight: 400;
            background: rgba(230, 235, 240, 0.5); padding: 8px 18px;
            border-radius: 60px; backdrop-filter: blur(4px);
            border: 1px solid rgba(180, 195, 210, 0.5); transition: all 0.2s;
        }
        .back-link:hover {
            background: rgba(210, 220, 230, 0.7); color: #1a3a4e;
            border-color: #9aafc0; transform: translateX(-4px);
        }
        .page-title {
            display: flex; align-items: center; gap: 12px;
        }
        .page-title i {
            font-size: 2.2rem; color: #5a6f7e; opacity: 0.9;
        }
        .page-title h1 {
            font-weight: 350; font-size: 2.2rem; letter-spacing: 2px;
            color: #1e4459; text-shadow: 2px 2px 8px rgba(255,255,255,0.5);
            border-bottom: 1.5px solid rgba(100, 120, 140, 0.3); padding-bottom: 4px;
        }

        /* 描述条 */
        .info-banner {
            margin-bottom: 32px; display: flex; align-items: center; gap: 15px;
            flex-wrap: wrap; background: rgba(200, 215, 230, 0.2);
            padding: 10px 22px; border-radius: 48px; backdrop-filter: blur(4px);
            border: 1px solid rgba(150, 170, 190, 0.3);
        }
        .info-banner i { color: #3f6a82; }

        /* 项目网格 (3个项目) */
        .projects-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 28px; margin-bottom: 20px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(8px); border-radius: 32px;
            padding: 26px 20px 22px;
            border: 1px solid rgba(210, 225, 240, 0.8);
            border-top: 8px solid #6a8ca0;
            box-shadow: 0 12px 24px -10px rgba(40, 70, 90, 0.15);
            transition: 0.2s; display: flex; flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-6px); background: rgba(255, 255, 255, 0.65);
            box-shadow: 0 20px 30px -12px rgba(50, 80, 110, 0.2);
        }

        .card-icon {
            font-size: 2.8rem; color: #3b6e8a; margin-bottom: 16px;
        }
        .card-title {
            font-size: 1.6rem; font-weight: 550; color: #1a4357;
            margin-bottom: 8px;
        }
        .card-desc {
            font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px;
            line-height: 1.5; flex: 1;
        }

        .tech-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
        }
        .tech-tag {
            background: #cbdae5; padding: 4px 12px; border-radius: 30px;
            font-size: 0.7rem; font-weight: 500; color: #1e4459;
        }

        .card-actions {
            display: flex; gap: 14px; align-items: center; margin-top: auto;
        }
        .btn {
            background: rgba(210, 225, 240, 0.7); border: 1px solid #8da9bc;
            padding: 10px 18px; border-radius: 40px; font-size: 0.9rem;
            color: #1e4459; cursor: pointer; backdrop-filter: blur(4px);
            transition: 0.2s; display: inline-flex; align-items: center; gap: 8px;
            text-decoration: none; font-weight: 450; flex: 1; justify-content: center;
        }
        .btn i { font-size: 1rem; }
        .btn:hover {
            background: #6a8ca0; color: white; border-color: #4e6f82;
        }
        .btn-outline {
            background: transparent;
        }

        /* 视频模态框 */
        .video-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10,30,40,0.5); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 999;
        }
        .video-container {
            max-width: 800px; width: 90%; background: #e1edf5; border-radius: 32px;
            padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        .video-container video {
            width: 100%; border-radius: 20px; max-height: 70vh;
        }
        .close-video {
            float: right; background: none; border: none; font-size: 1.8rem;
            cursor: pointer; color: #1e4459; margin-bottom: 8px;
        }

        /* 响应式 */
        @media screen and (max-width: 900px) {
            .projects-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media screen and (max-width: 600px) {
            .projects-grid { grid-template-columns: 1fr; }
            .page-wrapper { padding: 1.8rem 1.2rem; }
        }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="ink-bg"></div>
    <div class="content">
        <div class="top-bar">
            <a href="industry.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回工业作品集</a>
            <div class="page-title">
                <i class="fas fa-industry"></i>
                <i class="fas fa-plus" style="font-size:1.2rem; opacity:0.5;"></i>
                <i class="fas fa-microchip"></i>
                <h1>（进行中）智能工厂 · PLC 集成</h1>
            </div>
        </div>

        <!-- 三个项目卡片 -->
        <div class="projects-grid" id="projectsContainer"></div>
    </div>
</div>

<!-- 视频模态框 -->
<div class="video-modal" id="videoModal" onclick="closeVideoModal(event)">
    <div class="video-container" onclick="event.stopPropagation()">
        <button class="close-video" onclick="closeVideoModal()"><i class="fas fa-times"></i></button>
        <video id="modalVideo" controls autoplay>
            <source src="" type="video/mp4">
        </video>
    </div>
</div>

<script>
    // 项目数据 —— 可自定义替换
    const projects = [
        {
            name: '工厂机器人自动加工',
            icon: 'fa-flask',
            desc: '基于西门子S7-1200 PLC，集成传输，视觉，机器人自动运行等模块，实现机器人自动加工流程控制。',
            tags: ['S7-1200', '机器人', '自动'],
            video: 'videos/filling_line.mp4',
            archive: 'projects/filling_line.zip'
        },
        {
            name: '智能仓储分拣系统（进行中）',
            icon: 'fa-warehouse',
            desc: 'PLC控制输送带、气缸推杆及传感器，实现货物自动分拣与入库管理。',
            tags: ['Modbus TCP', '光电传感器'],
            video: 'videos/warehouse_sorting.mp4',
            archive: 'projects/warehouse_sorting.zip'
        }
    ];

    const container = document.getElementById('projectsContainer');

    function renderProjects() {
        let html = '';
        projects.forEach(proj => {
            html += `
                <div class="project-card">
                    <div class="card-icon">
                        <i class="fas ${proj.icon}"></i>
                    </div>
                    <div class="card-title">${proj.name}</div>
                    <div class="card-desc">${proj.desc}</div>
                    <div class="tech-tags">
                        ${proj.tags.map(t => `<span class="tech-tag">${t}</span>`).join('')}
                    </div>
                    <div class="card-actions">
                        <button class="btn" onclick="playVideo('${proj.video}')">
                            <i class="fas fa-play"></i> 视频
                        </button>
                        <a href="${proj.archive}" class="btn btn-outline" download>
                            <i class="fas fa-download"></i> 压缩包
                        </a>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    renderProjects();

    // 视频模态框逻辑
    const videoModal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');

    window.playVideo = function(videoSrc) {
        modalVideo.src = videoSrc;
        videoModal.style.display = 'flex';
        modalVideo.load();
        modalVideo.play();
    };

    window.closeVideoModal = function(event) {
        if (!event || event.target === videoModal || event.target.classList.contains('close-video')) {
            videoModal.style.display = 'none';
            modalVideo.pause();
            modalVideo.src = '';
        }
    };

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && videoModal.style.display === 'flex') {
            closeVideoModal();
        }
    });
</script>

<!-- 说明：请将视频文件与压缩包放入对应目录，路径可修改 -->
</body>
</html>
